apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-stable
  namespace: canary-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myapp-stable
      track: stable
  template:
    metadata:
      labels:
        app: myapp
        track: stable
    spec:
      containers:
        - name: myapp
          image: ${{secrects.DOCKERHUB_USERNAME}}/canary-demo-pipeline:latest
          ports:
            - containerPort: 3000
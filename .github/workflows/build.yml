name: Node Build Test
on:
  push:
    branches:
      -main
    pull_request:
      branches:
        -main
jobs:
  build:
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 
      uses: actions/setup-node@v4
      with:
        node-version: '18'
      
    - name: Install dependencies
      run: |
        cd app
        npm install
    
    - name: Run tests
      run: |
        cd app
        node -e "console.log('Tests passed!')"